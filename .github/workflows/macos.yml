name: macos

on:
  push:
    paths:
      - "mac/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "mac/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-tests:
    name: core tests (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: swift --version
      - name: swift test
        run: swift test --package-path mac

  build-macos:
    name: build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          swift --version
          xcodebuild -version
          uname -m
          sw_vers
      - name: build
        run: swift build -c release --package-path mac
      - name: make app
        run: bash mac/scripts/make-app.sh mac/.build/release/CuktechTray dist
      - name: selftest
        run: dist/CuktechTray.app/Contents/MacOS/CuktechTray --selftest
      - name: launch and try to screenshot
        run: |
          set +e
          open dist/CuktechTray.app
          sleep 6
          pgrep -fl CuktechTray
          echo "--- screencapture ---"
          screencapture -x shot.png
          echo "screencapture exit=$?"
          ls -l shot.png 2>/dev/null
          echo "--- app log ---"
          pkill -f CuktechTray
          true
      - name: pairing wizard screenshot
        run: |
          set +e
          dist/CuktechTray.app/Contents/MacOS/CuktechTray --wizard-demo &
          sleep 5
          pgrep -fl CuktechTray
          screencapture -x wizard.png
          echo "wizard screencapture exit=$?"
          ls -l wizard.png 2>/dev/null
          pkill -f CuktechTray
          true
      - name: pack
        run: bash mac/scripts/package.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: wizard-${{ matrix.runner }}
          path: |
            dist/*.zip
            shot.png
            wizard.png
          if-no-files-found: warn

  # tag（与 Windows 同版本号，例如 v0.4.5）时把 .app 打成 zip 传到 Release。
  # 同一份 Release 里 Windows 那个 job 会传 CuktechTray-<版本>-win.exe，这里传 -mac.zip。
  release-asset:
    name: release asset (mac zip)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-macos
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: swift build -c release --package-path mac
      - name: make app
        run: bash mac/scripts/make-app.sh mac/.build/release/CuktechTray dist
      - name: selftest
        run: dist/CuktechTray.app/Contents/MacOS/CuktechTray --selftest
      - name: package zip
        run: bash mac/scripts/package.sh dist
      - name: upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/CuktechTray-*-mac.zip --clobber