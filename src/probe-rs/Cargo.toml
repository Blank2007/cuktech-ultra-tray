[package]
name = "probe-rs"
version = "0.1.0"
edition = "2021"
description = "Feasibility spike: BLE scan (btleplug/WinRT) + tray icon (tray-icon + winit)"

[[bin]]
name = "probe-rs"
path = "src/main.rs"

[dependencies]
# Windows backend is selected automatically (WinRT) on cfg(windows).
btleplug = "0.13"
futures = "0.3"
tokio = { version = "1", features = ["rt", "time", "macros"] }
tray-icon = "0.26"
uuid = "1"
winit = "0.30"
